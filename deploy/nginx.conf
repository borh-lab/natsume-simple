pid logs/nginx.pid;
error_log stderr;

events {}

http {
    access_log off;
    client_max_body_size 16k;
    large_client_header_buffers 2 8k;

    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=api_connections:10m;

    upstream natsume {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 8080;

        location /api/ {
            limit_req zone=api_rate burst=5 nodelay;
            limit_conn api_connections 4;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;
            proxy_pass http://natsume;
        }

        location / {
            proxy_pass http://natsume;
        }
    }

    # Host-local probes bypass public client limits but remain separately bounded.
    server {
        listen 127.0.0.1:8081;

        location = /live {
            proxy_read_timeout 3s;
            proxy_pass http://natsume/api/health/live;
        }

        location = /ready {
            proxy_read_timeout 3s;
            proxy_pass http://natsume/api/health/ready;
        }
    }
}
