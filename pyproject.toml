[project]
name = "natsume-simple"
version = "0.3.0"
description = "simple dependency relation search engine for Japanese"
authors = [{ name = "Bor Hodošček", email = "dev@bor.space" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars[pyarrow,excel]>=1.43.2,<2",
    "ginza==5.2.0",
    "ja-ginza==5.2.0",
    # GiNZA 5.2 model configs use nullable factory values rejected by Confection 1.
    "confection>=0.1.5,<1",
    "numpy>=2,<3",
    "spacy>=3.8.11,<3.8.12",
    # "spacy-transformers>=1.2.5",
    # "torch>=2.5.1",
    "wtpsplit>=2.2.1,<3",
    "duckdb>=1.5.5,<2",
    "pydantic>=2.13.4,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyter>=1.1.1",
    "notebook>=7.3.2",
    "pytest-testmon>=2.1.1",
    "pytest-watch>=4.2.0",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.2,<1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[project.optional-dependencies]
cpu = [
    "torch>=2.6.0",
]
cuda = [
    "torch==2.6.0+cu126",
    "onnxruntime-gpu>=1.20.1",
    "cupy-cuda12x>=13.3.0",
]
backend = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natsume_simple"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --doctest-modules"
testpaths = [
    "tests",
    "src",
]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL"
markers = [
    "nlp_model: requires the locally installed Japanese NLP model",
]
