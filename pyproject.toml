[project]
name = "natsume-simple"
version = "0.3.0"
description = "simple dependency relation search engine for Japanese"
authors = [{ name = "Bor Hodošček", email = "dev@bor.space" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5,<2",
    "pydantic>=2.13.4,<3",
]

[project.scripts]
natsume-corpus = "natsume_simple.builder_cli:main"

[project.optional-dependencies]
builder = [
    # spaCy imports Click directly; Typer 0.27 no longer supplies it transitively.
    "click>=8.4.2,<9",
    "polars[pyarrow,excel]>=1.43.2,<2",
    "ginza==5.2.0",
    "ja-ginza==5.2.0",
    # GiNZA 5.2 model configs use nullable factory values rejected by Confection 1.
    "confection>=0.1.5,<1",
    "numpy>=2,<3",
    "spacy>=3.8.11,<3.8.12",
    # "spacy-transformers>=1.2.5",
    # "torch>=2.5.1",
    "wtpsplit>=2.2.1,<3",
]
cpu = [
    "torch==2.13.0+cpu",
]
cuda = [
    "torch==2.13.0+cu126",
    "cupy-cuda12x>=14.1.1,<15",
]
backend = [
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.1,<1",
]
test = [
    "httpx2>=2.9.0,<3",
    "pytest>=9.1.1,<10",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "jupyter>=1.1.1",
    "notebook>=7.3.2",
    "pytest-testmon>=2.1.1",
    "pytest-watch>=4.2.0",
    "ruff>=0.16.2,<1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natsume_simple"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --doctest-modules"
testpaths = [
    "tests",
    "src",
]
doctest_optionflags = "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL"
markers = [
    "nlp_model: requires the locally installed Japanese NLP model",
]
