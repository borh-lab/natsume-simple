name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACCELERATOR: 'cpu'

jobs:
  check:
    name: Build
    permissions:
      id-token: "write"
      contents: "read"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Install frontend dependencies
        run: nix develop --command npm --prefix natsume-frontend ci
      - name: Run lint
        run: nix run .#lint
      - name: Run backend tests
        run: nix run .#run-tests
      - name: Check flake outputs
        run: nix flake check --no-write-lock-file
      - name: Run browser tests
        run: nix run .#playwright-check
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            natsume-frontend/playwright-report
            natsume-frontend/test-results
          if-no-files-found: ignore
